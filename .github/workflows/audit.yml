name: Security audit

on:
  schedule:
    # Daily at 06:00 UTC — surface new RUSTSEC advisories without waiting for a PR.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Read-only token: no job writes to the repo, and build scripts run here.
permissions:
  contents: read

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.19.8
      - run: cargo deny check advisories
