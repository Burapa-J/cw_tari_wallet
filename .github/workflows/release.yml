name: Release

# Pushing a `v*` tag builds the native libraries for every platform Cake Wallet
# ships, zips each as cw_tari_wallet-<tag>-<platform>.zip, adds the FRB Dart
# bindings and SHA256SUMS, and publishes a GitHub release. Run it by hand
# (workflow_dispatch) on a branch first: that dry run builds and packages
# everything as `dryrun` but publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Only a pushed v* tag publishes; a manual run is always a dry run, even on a tag.
  IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dryrun' }}
  # tari_common accepts only the networks of the group it was compiled for.
  # Mainnet group = MainNet + StageNet, chosen at runtime; one artifact per platform.
  TARI_TARGET_NETWORK: mainnet
  # Same NDK as Cake Wallet's build image (cake_wallet Dockerfile).
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  check:
    name: pre-release checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cargo.lock has no server, CLI, gRPC or OpenSSL crates
        run: ./scripts/check_forbidden_crates.sh
      - name: Tag matches the crate version
        if: env.IS_TAG == 'true'
        run: |
          version="$(grep -m1 -oE '^version = "[^"]+"' Cargo.toml | cut -d'"' -f2)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Tagged commit is on main
        # main is gated by CI's bridge codegen-drift job, so a commit on main has
        # Dart bindings that match its Rust; the release ships both from it.
        if: env.IS_TAG == 'true'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG ($GITHUB_SHA) is not on main; tag a commit on main after CI is green"
            exit 1
          fi

  build:
    name: build ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runs-on: ubuntu-24.04
            targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          - platform: ios
            runs-on: macos-15
            targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          - platform: macos
            runs-on: macos-15
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Oldest supported Ubuntu, so the .so needs only an older glibc.
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runs-on: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
          - platform: windows
            runs-on: windows-2022
            targets: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install the Android NDK
        if: matrix.platform == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install make
        if: matrix.platform == 'windows'
        run: command -v make || choco install make -y --no-progress
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Block the network (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # A blanket outbound block would also cut the runner's own connection to
        # GitHub and fail the job, so outbound is default-deny with exceptions for
        # the runner processes, programs already connected, and DNS. Restored in the
        # always() step below.
        run: |
          Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultOutboundAction |
            ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\firewall-profiles.json"
          # Also keep every program that already holds a connection (the hosted
          # runner's provisioner and other agents), except shells and the build tools.
          $build = 'pwsh', 'powershell', 'bash', 'sh', 'cmd', 'git', 'git-remote-https',
                   'curl', 'cargo', 'rustc', 'rustup', 'make', 'svchost'
          $connected = Get-NetTCPConnection -State Established -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue }
          $runner = @(Get-Process Runner.Listener, Runner.Worker -ErrorAction Stop) + @($connected) |
            Where-Object { $_.Path -and $build -notcontains $_.ProcessName } |
            ForEach-Object Path | Sort-Object -Unique
          Write-Output "Allowed outbound while offline:" $runner
          foreach ($program in $runner) {
            New-NetFirewallRule -DisplayName release-offline -Direction Outbound -Action Allow -Program $program | Out-Null
          }
          New-NetFirewallRule -DisplayName release-offline -Direction Outbound -Action Allow `
            -Program "$env:SystemRoot\System32\svchost.exe" -Protocol UDP -RemotePort 53 | Out-Null
          Set-NetFirewallProfile -All -Enabled True -DefaultOutboundAction Block
      - name: Build offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          case "$RUNNER_OS" in
            Linux)
              # Root creates a network namespace with no network (works whatever the
              # AppArmor userns policy), then drops back to this user. Variables are
              # passed by name: sudo-rs ignores a bare --preserve-env.
              keep=()
              for v in PATH HOME CARGO_HOME RUSTUP_HOME RUSTUP_TOOLCHAIN CARGO_TERM_COLOR \
                       CARGO_NET_OFFLINE TARI_TARGET_NETWORK ANDROID_HOME ANDROID_NDK_HOME; do
                if [ -n "${!v+x}" ]; then keep+=("$v=${!v}"); fi
              done
              offline=(sudo unshare --net -- sudo -u "$(id -un)" env "${keep[@]}") ;;
            macOS)
              offline=(sandbox-exec -f scripts/release/offline.sb) ;;
            *)
              # Windows: blocked by the firewall step above.
              offline=() ;;
          esac
          if "${offline[@]}" curl -sfI --max-time 10 https://index.crates.io/ > /dev/null 2>&1; then
            echo "::error::the offline build can still reach the internet"
            exit 1
          fi
          "${offline[@]}" ./scripts/release/build.sh "${{ matrix.platform }}" "$TAG" dist
      - name: Restore the network (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $saved = "$env:RUNNER_TEMP\firewall-profiles.json"
          if (Test-Path $saved) {
            foreach ($p in Get-Content $saved | ConvertFrom-Json) {
              Set-NetFirewallProfile -Name $p.Name -Enabled $p.Enabled -DefaultOutboundAction $p.DefaultOutboundAction
            }
          }
          Remove-NetFirewallRule -DisplayName release-offline -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, to find the previous release for the size delta.
          fetch-depth: 0
      # shortcut: reports the stable rustc on this runner, which equals the build
      # jobs' (rust-toolchain.toml pins `stable`) unless a Rust release lands mid-run;
      # record it per build job if that ever matters.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Package the Dart bindings
        # Only the committed .dart/ files, i.e. exactly what this commit's libraries were generated with.
        run: git archive --format=zip --prefix=dart/ -o "dist/cw_tari_wallet-$TAG-dart.zip" HEAD:.dart
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS
      - name: Release notes
        run: |
          previous=()
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            if ! gh release view "$prev_tag" --json tagName,assets > "$RUNNER_TEMP/previous.json"; then
              echo "::warning::could not read the $prev_tag release; the size report has no delta"
              jq -n --arg tag "$prev_tag" '{tagName: $tag, assets: null}' > "$RUNNER_TEMP/previous.json"
            fi
            previous=("$RUNNER_TEMP/previous.json")
          fi
          python3 scripts/release/release_notes.py "$TAG" "$GITHUB_SHA" "$(rustc -V)" dist "${previous[@]}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish
        if: env.IS_TAG == 'true'
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
